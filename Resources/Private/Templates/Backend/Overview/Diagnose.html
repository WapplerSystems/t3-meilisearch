<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.heading"/></h1>
    <f:variable name="active" value="diagnose"/>
    <f:render partial="Backend/TabNav" arguments="{_all}" />

    <p class="lead">
        <f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.lead"/>
    </p>

    <f:for each="{cards}" as="card">
        <div class="card mb-4">
            <div class="card-header d-flex align-items-center">
                <strong>{card.identifier}</strong>
                <f:if condition="{card.configured}">
                    <f:else>
                        <span class="badge bg-secondary ms-2"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.notConfigured"/></span>
                    </f:else>
                </f:if>
                <f:if condition="{card.error}">
                    <span class="badge bg-danger ms-2" title="{card.error}"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.error"/></span>
                </f:if>
            </div>
            <div class="card-body">

                <div class="row">
                    <f:comment>Embedder column</f:comment>
                    <div class="col-md-6 border-end">
                        <h3 class="h5"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.embedder"/></h3>
                        <f:if condition="{card.desiredEmbedder}">
                            <f:then>
                                <h4 class="h6 text-muted mt-3"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.desired"/></h4>
                                <dl class="row mb-0">
                                    <f:for each="{card.desiredEmbedder}" as="value" key="key">
                                        <dt class="col-sm-4"><code>{key}</code></dt>
                                        <dd class="col-sm-8"><code>{value}</code></dd>
                                    </f:for>
                                </dl>
                                <h4 class="h6 text-muted mt-3"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.actual"/></h4>
                                <f:if condition="{card.actualEmbedder}">
                                    <f:then>
                                        <dl class="row mb-0">
                                            <f:for each="{card.actualEmbedder}" as="value" key="key">
                                                <dt class="col-sm-4"><code>{key}</code></dt>
                                                <dd class="col-sm-8"><code>{value -> f:format.raw()}</code></dd>
                                            </f:for>
                                        </dl>
                                    </f:then>
                                    <f:else>
                                        <p class="text-warning"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.notAppliedYet"/></p>
                                    </f:else>
                                </f:if>
                                <f:if condition="{card.configured}">
                                    <form action="{repushUrl}" method="post" class="mt-3">
                                        <input type="hidden" name="site" value="{card.identifier}" />
                                        <button type="submit" class="btn btn-sm btn-default"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.repushEmbedder"/></button>
                                    </form>
                                </f:if>
                            </f:then>
                            <f:else>
                                <p class="text-muted"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.noEmbedder"/></p>
                            </f:else>
                        </f:if>
                    </div>

                    <f:comment>RAG column</f:comment>
                    <div class="col-md-6">
                        <h3 class="h5"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.rag"/></h3>
                        <f:if condition="{card.rag}">
                            <f:then>
                                <dl class="row mb-0">
                                    <dt class="col-sm-4"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.provider"/></dt>
                                    <dd class="col-sm-8"><code>{card.rag.provider}</code></dd>

                                    <dt class="col-sm-4"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.model"/></dt>
                                    <dd class="col-sm-8"><code>{card.rag.model}</code></dd>

                                    <f:if condition="{card.rag.url}">
                                        <dt class="col-sm-4"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.url"/></dt>
                                        <dd class="col-sm-8"><code>{card.rag.url}</code></dd>
                                    </f:if>

                                    <dt class="col-sm-4"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.apiKey"/></dt>
                                    <dd class="col-sm-8">
                                        <f:if condition="{card.rag.hasApiKey}">
                                            <f:then><span class="badge bg-success"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.set"/></span></f:then>
                                            <f:else><span class="badge bg-secondary"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.notSet"/></span></f:else>
                                        </f:if>
                                    </dd>

                                    <dt class="col-sm-4"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.hybridRetrieval"/></dt>
                                    <dd class="col-sm-8">
                                        <f:if condition="{card.rag.useHybrid}">
                                            <f:then><span class="badge bg-success"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.on"/></span></f:then>
                                            <f:else><span class="badge bg-secondary"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.off"/></span></f:else>
                                        </f:if>
                                    </dd>

                                    <dt class="col-sm-4"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.conversationMemory"/></dt>
                                    <dd class="col-sm-8">
                                        <f:if condition="{card.rag.conversationEnabled}">
                                            <f:then><span class="badge bg-success"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.enabled"/></span></f:then>
                                            <f:else><span class="badge bg-secondary"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.disabled"/></span></f:else>
                                        </f:if>
                                    </dd>

                                    <dt class="col-sm-4"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.maxContextHits"/></dt>
                                    <dd class="col-sm-8">{card.rag.maxContextHits}</dd>

                                    <dt class="col-sm-4"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.temperature"/></dt>
                                    <dd class="col-sm-8">{card.rag.temperature}</dd>
                                </dl>
                                <form action="{pingUrl}" method="post" class="mt-3">
                                    <input type="hidden" name="site" value="{card.identifier}" />
                                    <button type="submit" class="btn btn-sm btn-default"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.pingProvider"/></button>
                                </form>
                            </f:then>
                            <f:else>
                                <p class="text-muted"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.diagnose.noRag"/></p>
                            </f:else>
                        </f:if>
                    </div>
                </div>
            </div>
        </div>
    </f:for>
</f:section>
</html>
