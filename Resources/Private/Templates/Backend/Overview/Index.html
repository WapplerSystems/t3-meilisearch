<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:layout name="Module" />

<f:section name="Content">
    <h1><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.headline"/></h1>
    <f:variable name="active" value="index"/>
    <f:render partial="Backend/TabNav" arguments="{_all}" />

    <p class="lead">
        <f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.lead"/>
    </p>

    <table class="table table-striped">
        <thead>
            <tr>
                <th><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.column.site"/></th>
                <th><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.column.index"/></th>
                <th><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.column.documents"/></th>
                <th><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.column.embedder"/></th>
                <th><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.column.rag"/></th>
                <th class="text-end"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.column.actions"/></th>
            </tr>
        </thead>
        <tbody>
            <f:for each="{sites}" as="site">
                <tr>
                    <td><code>{site.identifier}</code></td>
                    <td>
                        <f:if condition="{site.configured}">
                            <f:then><code>{site.indexName}</code></f:then>
                            <f:else><span class="badge bg-secondary"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.notConfigured"/></span></f:else>
                        </f:if>
                    </td>
                    <td>
                        <f:if condition="{site.error}">
                            <f:then><span class="text-danger" title="{site.error}"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.error"/></span></f:then>
                            <f:else>
                                <f:if condition="{site.docCount}">
                                    <f:then>{site.docCount}</f:then>
                                    <f:else>—</f:else>
                                </f:if>
                            </f:else>
                        </f:if>
                    </td>
                    <td>
                        <f:if condition="{site.embedderSource}">
                            <f:then>
                                <code>{site.embedderSource}</code>
                                <f:if condition="{site.embedderActive}">
                                    <f:then><span class="badge bg-success ms-1"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.active"/></span></f:then>
                                    <f:else><span class="badge bg-warning ms-1"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.notPushed"/></span></f:else>
                                </f:if>
                            </f:then>
                            <f:else><span class="text-muted"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.keywordOnly"/></span></f:else>
                        </f:if>
                    </td>
                    <td>
                        <f:if condition="{site.ragProvider}">
                            <f:then><code>{site.ragProvider}</code></f:then>
                            <f:else><span class="text-muted"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.disabled"/></span></f:else>
                        </f:if>
                    </td>
                    <td class="text-end">
                        <f:if condition="{site.configured}">
                            <form action="{reindexUrl}" method="post" class="d-inline">
                                <input type="hidden" name="site" value="{site.identifier}" />
                                <button type="submit" class="btn btn-sm btn-default"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.reindex"/></button>
                            </form>
                            <form action="{reindexUrl}" method="post" class="d-inline ms-1">
                                <input type="hidden" name="site" value="{site.identifier}" />
                                <input type="hidden" name="rebuild" value="1" />
                                <button type="submit" class="btn btn-sm btn-warning" data-confirm="{f:translate(key: 'LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.confirmRebuild', arguments: {0: site.identifier})}" onclick="return confirm(this.dataset.confirm);"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.rebuild"/></button>
                            </form>
                        </f:if>
                    </td>
                </tr>
            </f:for>
        </tbody>
    </table>

    <h2 class="mt-4"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.overview.registeredLlmProviders"/></h2>
    <p>
        <f:for each="{availableProviders}" as="p">
            <code class="me-2">{p}</code>
        </f:for>
    </p>
</f:section>
</html>
