<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">
    <f:layout name="Module" />
    <f:section name="Content">
        <h1><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.headline"/></h1>
        <p class="text-muted">
            <f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.intro"/>
        </p>

        <f:if condition="{noSites}">
            <f:then>
                <div class="alert alert-warning"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.noSiteAccess"/></div>
            </f:then>
            <f:else>
                <div class="card mb-3">
                    <div class="card-header"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.filter"/></div>
                    <div class="card-body">
                        <form method="post" action="{listUrl}">
                            <div class="row g-3 align-items-end">
                                <div class="col">
                                    <label class="form-label" for="site"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.site"/></label>
                                    <select class="form-select" id="site" name="site">
                                        <f:for each="{sites}" as="site">
                                            <f:if condition="{site.identifier} == {siteIdentifier}">
                                                <f:then><option value="{site.identifier}" selected="selected">{site.title}</option></f:then>
                                                <f:else><option value="{site.identifier}">{site.title}</option></f:else>
                                            </f:if>
                                        </f:for>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="form-label" for="language"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.language"/></label>
                                    <select class="form-select" id="language" name="language">
                                        <f:if condition="{filterLanguage} == ''">
                                            <f:then><option value="" selected="selected"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.all"/></option></f:then>
                                            <f:else><option value=""><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.all"/></option></f:else>
                                        </f:if>
                                        <f:for each="{languages}" as="language">
                                            <f:if condition="{filterLanguage} == {language.id}">
                                                <f:then><option value="{language.id}" selected="selected">{language.title}</option></f:then>
                                                <f:else><option value="{language.id}">{language.title}</option></f:else>
                                            </f:if>
                                        </f:for>
                                    </select>
                                </div>
                                <div class="col">
                                    <label class="form-label" for="q"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.search"/></label>
                                    <input class="form-control" id="q" name="q" type="search" value="{q}" placeholder="{f:translate(key: 'LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.searchPlaceholder')}">
                                </div>
                                <div class="col">
                                    <label class="form-label" for="state"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.status"/></label>
                                    <select class="form-select" id="state" name="state">
                                        <f:if condition="{state} == ''">
                                            <f:then><option value="" selected="selected"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.all"/></option></f:then>
                                            <f:else><option value=""><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.all"/></option></f:else>
                                        </f:if>
                                        <f:if condition="{state} == 'visible'">
                                            <f:then><option value="visible" selected="selected"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.visible"/></option></f:then>
                                            <f:else><option value="visible"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.visible"/></option></f:else>
                                        </f:if>
                                        <f:if condition="{state} == 'hidden'">
                                            <f:then><option value="hidden" selected="selected"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.hidden"/></option></f:then>
                                            <f:else><option value="hidden"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.hidden"/></option></f:else>
                                        </f:if>
                                    </select>
                                </div>
                                <div class="col-auto">
                                    <button class="btn btn-primary" type="submit"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.applyFilter"/></button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <f:if condition="{canModify}">
                    <f:then>
                        <a class="btn btn-primary mb-3" href="{newUrl}"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.newEntry"/></a>
                    </f:then>
                </f:if>

                <f:if condition="{rows}">
                    <f:then>
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.columnTitle"/></th>
                                    <th><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.language"/></th>
                                    <th><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.status"/></th>
                                    <th><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.changed"/></th>
                                    <th><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.fromChat"/></th>
                                    <f:if condition="{canModify}">
                                        <f:then><th><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.actions"/></th></f:then>
                                    </f:if>
                                </tr>
                            </thead>
                            <tbody>
                                <f:for each="{rows}" as="row">
                                    <tr>
                                        <td>
                                            <div>{row.title}</div>
                                            <small class="text-muted">{row.excerpt}</small>
                                        </td>
                                        <td>
                                            <f:if condition="{row.languageFlag}">
                                                <f:then><core:icon identifier="{row.languageFlag}" /></f:then>
                                            </f:if>
                                            <span title="{row.languageTitle}">{row.languageTitle}</span>
                                        </td>
                                        <td>
                                            <f:if condition="{row.hidden}">
                                                <f:then><span class="badge bg-secondary"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.hidden"/></span></f:then>
                                                <f:else>
                                                    <f:if condition="{row.active}">
                                                        <f:then><span class="badge bg-success"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.active"/></span></f:then>
                                                        <f:else><span class="badge bg-warning text-dark"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.scheduled"/></span></f:else>
                                                    </f:if>
                                                </f:else>
                                            </f:if>
                                        </td>
                                        <td><f:format.date format="d.m.Y H:i">{row.tstamp}</f:format.date></td>
                                        <td>
                                            <f:if condition="{row.sourceConversation}">
                                                <f:then><small class="text-muted"><code>{row.sourceConversationShort}</code></small></f:then>
                                            </f:if>
                                        </td>
                                        <f:if condition="{canModify}">
                                            <f:then>
                                                <td>
                                                    <a class="btn btn-sm btn-outline-primary" href="{row.editUrl}"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.edit"/></a>
                                                    <a class="btn btn-sm btn-outline-secondary" href="{row.toggleUrl}">
                                                        <f:if condition="{row.hidden}">
                                                            <f:then><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.show"/></f:then>
                                                            <f:else><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.hide"/></f:else>
                                                        </f:if>
                                                    </a>
                                                    <a href="{row.deleteUrl}" class="btn btn-sm btn-outline-danger t3js-modal-trigger" data-title="{f:translate(key: 'LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.deleteConfirmTitle')}" data-content="{f:translate(key: 'LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.deleteConfirmText', arguments: {0: row.title})}" data-severity="warning" data-button-close-text="{f:translate(key: 'LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.cancel')}" data-button-ok-text="{f:translate(key: 'LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.delete')}"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.delete"/></a>
                                                </td>
                                            </f:then>
                                        </f:if>
                                    </tr>
                                </f:for>
                            </tbody>
                        </table>
                        <f:if condition="{limitReached}">
                            <f:then><small class="text-muted"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.maxEntriesShown"/></small></f:then>
                        </f:if>
                    </f:then>
                    <f:else>
                        <div class="alert alert-info"><f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang_be.xlf:be.knowledge.noEntries"/></div>
                    </f:else>
                </f:if>
            </f:else>
        </f:if>
    </f:section>
</html>
