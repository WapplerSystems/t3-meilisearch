<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">

<f:layout name="Default"/>

<f:comment>GET only — see Search.html for the rationale.</f:comment>

<f:section name="Main">
    <div class="ws-meilisearch">
        <form class="ws-meilisearch-form" action="{f:uri.page()}" method="get" role="search">
            <input type="hidden" name="tx_wsmeilisearch_search[action]" value="results"/>
            <input type="hidden" name="tx_wsmeilisearch_search[controller]" value="Search"/>

            <label for="ws-meilisearch-q" class="visually-hidden">
                <f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang.xlf:search.form.placeholder"/>
            </label>
            <div class="input-group input-group-lg mb-4 ws-meilisearch-suggest" data-ws-meilisearch-suggest
                data-label-recent="{f:translate(key: 'LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang.xlf:suggest.recent.heading')}"
                data-label-more="{f:translate(key: 'LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang.xlf:suggest.more')}">
                <input type="search"
                    id="ws-meilisearch-q"
                    class="form-control"
                    name="tx_wsmeilisearch_search[q]"
                    value="{query}"
                    placeholder="{f:translate(key: 'LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang.xlf:search.form.placeholder')}"
                    autocomplete="off"
                    data-suggest-input="data-suggest-input"/>
                <button type="submit" class="btn btn-primary">
                    <f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang.xlf:search.form.submit"/>
                </button>
                <ul class="ws-meilisearch-suggest__menu" data-suggest-menu="data-suggest-menu" hidden="hidden"></ul>
            </div>
            <f:asset.script identifier="ws_meilisearch-suggest" src="EXT:ws_meilisearch/Resources/Public/JavaScript/Frontend/suggest.js" defer="defer"/>
            <f:asset.css identifier="ws_meilisearch-suggest" href="EXT:ws_meilisearch/Resources/Public/CSS/suggest.css"/>

            <a id="ws-meilisearch-results" tabindex="-1" class="visually-hidden">Results</a>

            <f:if condition="{result.totalHits} > 0">
                <f:then>
                    <p class="ws-meilisearch-meta text-muted small mb-3">
                        <f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang.xlf:search.results.count"
                            arguments="{0: result.totalHits, 1: query}"/>
                    </p>

                    <div class="ws-meilisearch-layout row g-4">
                        <aside class="ws-meilisearch-facets col-lg-3">
                            <f:render partial="Search/Facets" arguments="{facets: result.facets, filters: filters, languageLabels: languageLabels}"/>
                        </aside>
                        <main class="ws-meilisearch-hits col-lg-9">
                            <f:for each="{result.hits}" as="hit">
                                <f:render partial="Search/Result" arguments="{hit: hit}"/>
                            </f:for>
                        </main>
                    </div>
                </f:then>
                <f:else>
                    <div class="alert alert-info ws-meilisearch-empty" role="status">
                        <f:translate key="LLL:EXT:ws_meilisearch/Resources/Private/Language/locallang.xlf:search.results.empty"
                            arguments="{0: query}"/>
                    </div>
                </f:else>
            </f:if>

            <f:asset.script identifier="ws_meilisearch-scroll-to-results" src="EXT:ws_meilisearch/Resources/Public/JavaScript/Frontend/scroll-to-results.js" defer="defer"/>
        </form>
    </div>
</f:section>

</html>
