<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true">
<f:comment>
    No layout, no sections — output is the rendered ResultRegion partial
    alone, ready to drop into the existing result-region div via Ajax
    innerHTML replacement. Full-page rendering uses Results.html (which
    declares the Default layout and the Main section).
</f:comment>
<f:render partial="Search/ResultRegion" arguments="{_all}"/>
</html>
