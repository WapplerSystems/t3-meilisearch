services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  WapplerSystems\Meilisearch\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Schema/SchemaProviderInterface.php'
      - '../Classes/Domain/RecordSource/PluginRecordSourceInterface.php'
      - '../Classes/Event/*'
      - '../Classes/Service/SearchResult.php'
      - '../Classes/Service/Llm/LlmProviderInterface.php'
      - '../Classes/Service/Llm/LlmException.php'
      - '../Classes/Service/Rag/RagAnswer.php'
      # Plain value object built by QueryClassifier (private constructor);
      # never injected.
      - '../Classes/Service/Rag/Clarification.php'
      # ExtIndexOrigin is a per-event marker instantiated by the listener;
      # registering it as a singleton service would also pull it into the
      # schema_provider iterator via _instanceof, which is wrong (it returns
      # empty iterators on purpose).
      - '../Classes/Integration/ExtIndex/Schema/ExtIndexOrigin.php'
      # Plain value objects: built by SearchConfigurationProvider /
      # ApplyMeilisearchSettingsCommand from Site Settings, never injected.
      - '../Classes/Configuration/Dto/*'
      # ImportResult is a readonly DTO built by KnowledgeResourceSourceImporter
      # implementations; the interface itself stays out of the container.
      - '../Classes/Service/Import/ImportResult.php'
      - '../Classes/Service/Import/KnowledgeResourceSourceImporter.php'
      # RagTestResult is a readonly DTO returned by RagTestRunner;
      # interface is a marker, not a service.
      - '../Classes/Service/RagTest/RagTestResult.php'
      - '../Classes/Service/RagTest/EmbeddingClientInterface.php'
      # QuotaStatus readonly DTO + interface marker.
      - '../Classes/Service/Quota/QuotaStatus.php'
      - '../Classes/Service/Quota/QuotaProviderInterface.php'
      # Per-run objects and exceptions: DocumentBatchWriter is constructed
      # by IndexerService with run-specific arguments (site, index names,
      # mode flags) that no container can autowire, IndexWriteStats is its
      # value object, and the two exception classes are plain throwables.
      - '../Classes/Service/Indexing/*'

  _instanceof:
    WapplerSystems\Meilisearch\Domain\Schema\SchemaProviderInterface:
      tags: ['ws_meilisearch.schema_provider']
    WapplerSystems\Meilisearch\Domain\RecordSource\PluginRecordSourceInterface:
      tags: ['ws_meilisearch.plugin_record_source']
    WapplerSystems\Meilisearch\Service\Llm\LlmProviderInterface:
      tags: ['ws_meilisearch.llm_provider']
    WapplerSystems\Meilisearch\Service\Import\KnowledgeResourceSourceImporter:
      tags: ['ws_meilisearch.source_importer']
    WapplerSystems\Meilisearch\Service\RagTest\EmbeddingClientInterface:
      tags: ['ws_meilisearch.embedding_client']
    WapplerSystems\Meilisearch\Service\Quota\QuotaProviderInterface:
      tags: ['ws_meilisearch.quota_provider']

  WapplerSystems\Meilisearch\Domain\RecordSource\PluginRecordSourceRegistry:
    arguments:
      $sources: !tagged_iterator ws_meilisearch.plugin_record_source

  WapplerSystems\Meilisearch\Service\SearchEngineFactory:
    public: true
    arguments:
      $schemaProviders: !tagged_iterator ws_meilisearch.schema_provider

  WapplerSystems\Meilisearch\Service\IndexerService:
    public: true
    arguments:
      $schemaProviders: !tagged_iterator ws_meilisearch.schema_provider

  WapplerSystems\Meilisearch\Service\SearchService:
    public: true

  WapplerSystems\Meilisearch\Service\Rag\RagService:
    public: true

  WapplerSystems\Meilisearch\Service\Llm\LlmProviderRegistry:
    arguments:
      $providers: !tagged_iterator ws_meilisearch.llm_provider

  WapplerSystems\Meilisearch\Service\Import\SourceImporterRegistry:
    public: true
    arguments:
      $importers: !tagged_iterator ws_meilisearch.source_importer

  WapplerSystems\Meilisearch\Service\RagTest\EmbeddingClientRegistry:
    arguments:
      $clients: !tagged_iterator ws_meilisearch.embedding_client

  # Public because RunRagTestsTask instantiates the runner via
  # GeneralUtility::makeInstance from the scheduler runtime, which has
  # no DI container reference.
  WapplerSystems\Meilisearch\Service\RagTest\RagTestRunner:
    public: true

  WapplerSystems\Meilisearch\Service\Quota\QuotaCheckRunner:
    arguments:
      $providers: !tagged_iterator ws_meilisearch.quota_provider

  # Hooked into DataHandler from ext_localconf.php — must be resolvable as a service.
  WapplerSystems\Meilisearch\DataHandling\RecordChangeListener:
    public: true

  # --- EXT:index integration ---------------------------------------------
  # Page + file indexing piggybacks on lochmueller/index's queue, content
  # processors and DataHandler hook. Hard dependency on lochmueller/index ^2.0
  # (see composer.json). Originally a separate `wapplersystems/meilisearch-
  # bridge` package; folded back in once the API surface stabilised.

  WapplerSystems\Meilisearch\Integration\ExtIndex\EventListener\IndexEventListener:
    tags:
      - name: monolog.logger
        channel: ws_meilisearch_extindex

  WapplerSystems\Meilisearch\Integration\ExtIndex\EventListener\ContainerChildrenListener:
    tags:
      - name: monolog.logger
        channel: ws_meilisearch_extindex

  WapplerSystems\Meilisearch\Integration\ExtIndex\FileExtraction\TikaFileExtractor:
    tags:
      - name: monolog.logger
        channel: ws_meilisearch_extindex
      # priority > 0 so Tika beats EXT:index's bundled PDF/Office extractors
      # (Smalot\PdfParser etc.) which would otherwise win by registration order.
      - name: index.file_extractor
        priority: 100

  WapplerSystems\Meilisearch\Integration\ExtIndex\Messenger\IndexingContextMiddleware:
    tags:
      - name: monolog.logger
        channel: ws_meilisearch_extindex
      - name: messenger.middleware
        before: 'Symfony\Component\Messenger\Middleware\HandleMessageMiddleware'