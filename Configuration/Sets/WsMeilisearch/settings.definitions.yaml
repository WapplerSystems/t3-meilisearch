settings:
  meilisearch.url:
    label: 'Meilisearch URL'
    description: 'HTTP endpoint of the Meilisearch server (e.g. http://meilisearch:7700).'
    type: string
    default: 'http://meilisearch:7700'

  meilisearch.apiKey:
    label: 'Meilisearch master / API key'
    description: 'Master key (development) or scoped API key (production) for the Meilisearch server.'
    type: string
    default: ''

  meilisearch.indexPrefix:
    label: 'Index prefix'
    description: 'Prefix for all indexes managed by this site (e.g. "site1_"). Keeps multiple sites or environments isolated on the same Meilisearch server.'
    type: string
    default: ''

  meilisearch.restrictToCurrentLanguage:
    label: 'Restrict results to current language'
    description: 'When enabled, the search plugin force-filters results to the active site language and hides the language facet from the visitor. Use this on per-language search pages where the language choice would just be noise.'
    type: bool
    default: false

  meilisearch.indexedTables:
    label: 'Indexed record types'
    description: 'Comma-separated list of TCA tables to index. Pages, tx_news and tx_wsmeilisearch_knowledge_resource (knowledge resources imported via ws_meilisearch:import-knowledge-resources) are wired by default. Knowledge resources are indexed for RAG-grounding but hidden from the FE search result list and from the RAG answer''s "Sources" panel.'
    type: string
    default: 'pages,tx_news_domain_model_news,tx_wsmeilisearch_knowledge_resource'

  meilisearch.knowledgeResource.sourceRoot:
    label: 'Knowledge resource source root'
    description: 'On-disk path (absolute or relative to the project root) of the DITA-OT XHTML corpus served under /hilfe/. Files outside this root are not reachable. Leave empty to disable the /hilfe/ middleware.'
    type: string
    default: ''

  meilisearch.knowledgeResource.fileadminFolder:
    label: 'Knowledge resource FAL target folder'
    description: 'Default FAL combined identifier (e.g. 1:/knowledge/) where importers store uploaded files and extracted media. Operators can override per import via the BE folder picker. The folder is auto-created on first use.'
    type: string
    default: '1:/knowledge/'

  # --- Quota check (ws_meilisearch:check-quotas) -----------------------
  # Run periodically (cron / scheduler) against Infomaniak / OpenAI /
  # Anthropic to catch usage approaching the cap before it bites.

  meilisearch.quota.threshold:
    label: 'Quota warning threshold (%)'
    description: 'Percent of cap that triggers the warning email when ws_meilisearch:check-quotas runs. Default 80 — leaves enough runway to top up the plan before the hard cap.'
    type: int
    default: 80

  meilisearch.quota.recipient:
    label: 'Quota warning email recipient'
    description: 'Where warning emails go when a provider exceeds the threshold. Empty disables the email — the CLI still prints the table for log scraping. Single address or comma-separated list.'
    type: string
    default: ''

  # Stuck-task watchdog (ws_meilisearch:abort-stuck-tasks): cancels
  # Meilisearch tasks that have been in enqueued/processing state past
  # the threshold (typical cause: rate-limited embedder backend retrying
  # in a loop) so the index recovers without operator intervention.
  meilisearch.watchdog.stuckThresholdMinutes:
    label: 'Stuck-task threshold (minutes)'
    description: 'A Meilisearch task enqueued or processing for longer than this is treated as stuck and cancelled. 30 covers normal large-reindex peaks without false positives; lower it if your embedder is fast and the watchdog cron runs frequently.'
    type: int
    default: 30

  meilisearch.watchdog.recipient:
    label: 'Watchdog notification recipient'
    description: 'Email recipient for the stuck-task watchdog. Empty falls back to meilisearch.quota.recipient so operators only need to configure one inbox. Single address or comma-separated list.'
    type: string
    default: ''

  meilisearch.watchdog.resetEmbedderOnStuck:
    label: 'Reset embedder after cancelling stuck tasks'
    description: 'When true, the watchdog also clears the embedder configuration after cancelling — so the next document push falls back to keyword-only indexing instead of immediately re-triggering the same upstream failure. Operator must re-run ws_meilisearch:reindex once the upstream issue is resolved. Default off (conservative).'
    type: bool
    default: false

  # OpenAI's usage endpoint needs an Admin API key (sk-admin-…), NOT the
  # completion key used by the RAG provider — separate scope, separate
  # storage so a key rotation on one doesn't blast the other.
  meilisearch.quota.openai.adminKey:
    label: 'OpenAI admin API key (for quota check only)'
    description: 'Admin-scoped key (starts with sk-admin-...) needed by /v1/organization/usage/completions. NOT the same as meilisearch.rag.apiKey.'
    type: string
    default: ''
  meilisearch.quota.openai.monthlyCap:
    label: 'OpenAI monthly token cap'
    description: 'Operator-set cap in tokens; OpenAI returns usage but no quota number, so this is the value the threshold is measured against. Set to your monthly budget in tokens.'
    type: int
    default: 0

  # Same shape for Anthropic — admin key is separate from the completion
  # key, and the cap is operator-set since Anthropic doesn't expose
  # account-level quotas via API.
  meilisearch.quota.anthropic.adminKey:
    label: 'Anthropic admin API key (for quota check only)'
    description: 'Admin-scoped key needed by /v1/organizations/usage_report. NOT the same as meilisearch.rag.apiKey.'
    type: string
    default: ''
  meilisearch.quota.anthropic.monthlyCap:
    label: 'Anthropic monthly token cap'
    description: 'Operator-set cap in tokens; Anthropic returns usage but no quota number, so this is the value the threshold is measured against.'
    type: int
    default: 0

  # Infomaniak exposes NO usage API for AI Tools (verified 2026-06-07,
  # see the long comment in InfomaniakQuotaProvider). This token is
  # only used to confirm token validity + product reachability via
  # /1/ai. Quota numbers themselves must be read from the Manager UI.
  meilisearch.quota.infomaniak.apiToken:
    label: 'Infomaniak Manager API token (reachability check only)'
    description: 'Optional. Personal Access Token from manager.infomaniak.com → API. Used to confirm the AI product is reachable; Infomaniak does not expose a usage API so actual quota numbers must be read at manager.infomaniak.com → AI Tools.'
    type: string
    default: ''

  # --- RAG fallback contact info ---------------------------------------
  # Rendered below the RAG answer card so visitors have a way to reach a
  # human when the model has no good answer (or always, per .show below).

  meilisearch.rag.fallback.show:
    label: 'When to show the fallback contact'
    description: 'onlyEmpty = render only when the RAG pipeline returned no_context / failed / low-confidence (no citations). always = render under every answer. never = hide entirely.'
    type: string
    enum:
      onlyEmpty: 'Only when no answer / low confidence'
      always: 'Under every answer'
      never: 'Never (hide)'
    default: 'onlyEmpty'

  meilisearch.rag.fallback.contactName:
    label: 'Contact name / organisation'
    description: 'Optional heading above the contact details (e.g. "Acme Support" or "Anna Beispiel"). Empty hides the heading.'
    type: string
    default: ''

  meilisearch.rag.fallback.email:
    label: 'Fallback email address'
    description: 'Rendered as mailto: link. The visitor''s current question is pre-filled as the subject when they click. Empty hides the email row.'
    type: string
    default: ''

  meilisearch.rag.fallback.phone:
    label: 'Fallback phone number'
    description: 'Rendered as tel: link. Display value stays as typed; the href strips spaces / dashes so dialers don''t choke. Empty hides the phone row.'
    type: string
    default: ''

  meilisearch.rag.fallback.ticketUrl:
    label: 'Ticket system URL'
    description: 'Optional URL to a ticket system (Jira, Redmine, Zammad, …). Renders as a button "Open a ticket" when set.'
    type: string
    default: ''

  # --- RAG floating chat widget ----------------------------------------
  # When enabled, a bubble appears bottom-right on every FE page that
  # is rendered by this site's TypoScript root. Click → slide-up panel
  # iframes the RAG plugin page (chatWidget.url), giving visitors a
  # one-click chat entry from any page without needing dedicated chat
  # links in the navigation.

  meilisearch.rag.chatWidget.enabled:
    label: 'Enable floating chat widget'
    description: 'Render a chat bubble bottom-right on every page that opens the RAG plugin in a slide-up panel. Disabled by default — opt-in per site.'
    type: bool
    default: false

  meilisearch.rag.chatWidget.pageUid:
    label: 'Chat widget target page UID'
    description: 'TYPO3 page uid of the page that hosts the wsmeilisearch_rag plugin. The setup TypoScript resolves it via TypoLink at render time, so the bubble always points at the correct language overlay (DE → /de/x, EN → /en/x, …) and survives slug renames. Prefer this over the legacy chatWidget.url setting.'
    type: int
    default: 0

  meilisearch.rag.chatWidget.url:
    label: 'Chat widget target URL (legacy fallback)'
    description: 'Hardcoded URL the bubble panel iframes, used only when chatWidget.pageUid is 0. Brittle: bakes in the language prefix, breaks on slug renames and multi-language overlays. Migrate to chatWidget.pageUid; this field stays for backwards compatibility.'
    type: string
    default: ''

  meilisearch.rag.chatWidget.embedTypeNum:
    label: 'Chat widget embed page type'
    description: 'Page typeNum used for the bare chat view the widget iframe loads — renders ONLY the wsmeilisearch_rag plugin without the site header/nav/footer (styled by RagEmbed.css). The widget URL is built with this type appended. Change only if it collides with another page type on the site.'
    type: int
    default: 1748231

  meilisearch.analytics.enabled:
    label: 'Search analytics'
    description: 'When true, every non-trivial FE search is recorded in tx_wsmeilisearch_search_log so the BE analytics tab can show top queries / zero-result queries / hybrid-usage over time. Stores only {site, language, query, count, source, hybrid, timestamp} — no IPs, no session ids, no user agents.'
    type: bool
    default: false

  meilisearch.analytics.minQueryLength:
    label: 'Analytics: minimum query length to log'
    description: 'Queries shorter than this are not logged. Defaults to 2 to drop suggest-dropdown keystrokes that would otherwise generate one row per character typed.'
    type: int
    default: 2

  meilisearch.analytics.retentionDays:
    label: 'Analytics: retention (days)'
    description: 'How many days the analytics rows are kept before the cleanup task prunes them. 0 disables pruning. Defaults to 90 — enough for monthly trend reports without unbounded table growth.'
    type: int
    default: 90

  meilisearch.suggest.autoAttachInputSelector:
    label: 'Suggest: auto-attach CSS selector'
    description: 'CSS selector for layout-level search inputs (header bar, off-canvas, mobile menu) that should get the live-suggestion dropdown without rendering the ws_meilisearch_search Fluid template themselves. Leave empty to disable auto-attach — only inputs inside [data-ws-meilisearch-suggest] wrappers get the dropdown then. Example: "header input[type=\"search\"], .site-search input[type=\"search\"]".'
    type: string
    default: ''

  meilisearch.suggest.limit:
    label: 'Suggest: max results'
    description: 'Maximum number of suggestions in the flat (ungrouped) dropdown, and the overall cap. Default 5.'
    type: int
    default: 5

  meilisearch.suggest.groupByType:
    label: 'Suggest: group preview by type'
    description: 'When ON, the dropdown is split into per-type sections (Pages, News, Files, …) with a heading per type instead of one flat relevance-ranked list. Each section is capped at "Suggest: results per type". OFF (default) keeps the flat list.'
    type: bool
    default: false

  meilisearch.suggest.perTypeLimit:
    label: 'Suggest: results per type'
    description: 'Maximum suggestions shown per type section when "group preview by type" is ON. Default 3.'
    type: int
    default: 3

  meilisearch.suggest.types:
    label: 'Suggest: type order / allow-list'
    description: 'Ordered list of document types to show as sections when "group preview by type" is ON (e.g. [page, news, file, knowledge_resource]). The sections render in this order. Leave empty to show every type that surfaces, in relevance order. Types not listed here are appended after the configured ones.'
    type: stringlist
    default: []

  meilisearch.rag.chatWidget.label:
    label: 'Chat widget label'
    description: 'Used as the panel heading AND as the bubble''s aria-label / tooltip. Keep it short and self-explanatory (e.g. "KI-Chat", "Frag uns", "Help").'
    type: string
    default: 'KI-Chat'

  meilisearch.deduplicateFiles:
    label: 'Dedupe FAL files by site'
    description: 'When enabled, FAL files are only indexed into a site if they are actually referenced from a page belonging to that site (via sys_file_reference → page → site). Disabled by default so every site indexes every non-missing file — backward compatible with the original FAL-indexing rollout. Enable for production sites that share a Meilisearch server but want strict per-site search results.'
    type: bool
    default: false

  meilisearch.tika.url:
    label: 'Apache Tika Server URL'
    description: 'HTTP endpoint of an Apache Tika Server for text extraction from PDF / Office / RTF / EPUB files. Leave empty to disable FAL indexing entirely.'
    type: string
    default: 'http://tika:9998'

  meilisearch.tika.timeout:
    label: 'Tika request timeout (seconds)'
    description: 'How long to wait for a single file extraction before giving up. Heavy PDFs / scanned documents can take 30+ s.'
    type: int
    default: 60

  meilisearch.tika.maxFileSize:
    label: 'Tika max file size (bytes)'
    description: 'Files larger than this are skipped without contacting Tika. Default 50 MB.'
    type: int
    default: 52428800

  meilisearch.tika.ocrEnabled:
    label: 'Enable OCR'
    description: 'When true, the indexer asks Tika to OCR scanned PDFs and image files. Requires the "apache/tika:*-full" image (with Tesseract installed) — the base image rejects OCR-related headers with HTTP 400, so leave this off unless you switched to the full tag.'
    type: bool
    default: false

  meilisearch.tika.ocrLanguage:
    label: 'OCR language(s)'
    description: 'Tesseract language codes for OCR, comma-separated. Examples: "eng", "deu", "eng+deu". Only sent when ocrEnabled is true.'
    type: string
    default: 'eng'

  meilisearch.tika.ocrStrategy:
    label: 'PDF OCR strategy'
    description: 'How Tika decides whether to OCR a PDF. "no_ocr" = trust the embedded text layer (fast). "auto" = OCR only when the embedded text looks empty. "ocr_and_text_extraction" = always do both and concatenate (slow but thorough). "ocr_only" = ignore the embedded text layer entirely. Only sent when ocrEnabled is true.'
    type: string
    default: 'auto'

  meilisearch.indexing.allowedExtensions:
    label: 'Allowed file extensions'
    description: 'Whitelist of lower-case file extensions to include in the index. When non-empty, ONLY these extensions are indexed and excludeExtensions is ignored. Example: [pdf, docx, doc, html, htm, md, txt, rtf, odt, epub]. Empty by default — falls back to the excludeExtensions blacklist.'
    type: stringlist
    default: []

  meilisearch.indexing.excludeExtensions:
    label: 'Excluded file extensions'
    description: 'Blacklist applied when allowedExtensions is empty. Use for config / log / backup files that pollute the search corpus. Example: [yaml, yml, log, bak, tmp]. Ignored when allowedExtensions is non-empty.'
    type: stringlist
    default: []

  meilisearch.indexing.minImageSizeKb:
    label: 'Minimum image size (KB)'
    description: 'Skip image files (mime starts with image/) smaller than this. Filters out icons / flags / decorative graphics that pollute the search corpus without being useful as results. 10 catches most icons; 50 also catches small previews. Default 0 = no size filter.'
    type: int
    default: 0

  meilisearch.files.thumbnail.maxWidth:
    label: 'Image preview: max thumbnail width (px)'
    description: 'Maximum width of the preview thumbnail generated at index time for image files (scaled to fit, no crop). The URL is stored as thumbnailUrl and rendered in the result list. 0 = no width constraint (then maxHeight applies).'
    type: int
    default: 320

  meilisearch.files.thumbnail.maxHeight:
    label: 'Image preview: max thumbnail height (px)'
    description: 'Maximum height of the preview thumbnail generated at index time for image files (scaled to fit, no crop). 0 = no height constraint (then maxWidth applies). Both 0 = no thumbnail generated.'
    type: int
    default: 320

  meilisearch.indexing.excludeIdentifierPrefixes:
    label: 'Excluded sys_file identifier prefixes'
    description: 'Sys_file rows whose identifier starts with any of these prefixes are skipped. Matched with str_starts_with (case-sensitive) against the FAL identifier, which is STORAGE-RELATIVE and does NOT contain the public `/fileadmin/` segment — e.g. a frontend form upload has identifier `/user_upload/form_<hash>/file.pdf`, so the prefix is `/user_upload/form_`, NOT `/fileadmin/user_upload/`. Defaults keep generated artefacts (`/typo3temp/`), privacy-sensitive frontend form uploads (`/user_upload/form_`) and published extension assets (`/_assets/`) out of the search corpus. Default: [/typo3temp/, /user_upload/form_, /_assets/].'
    type: stringlist
    default:
      - '/typo3temp/'
      - '/user_upload/form_'
      - '/_assets/'

  meilisearch.indexing.requestsPerMinute:
    label: 'Reindex throttle (requests / minute)'
    description: 'Token-bucket cap on embedding API calls during reindex when meilisearch.embedder.precompute is on. 0 = unthrottled (legacy fire-and-forget). Match this to the embedding provider quota: Scaleway Generative APIs default is 300 RPM, Infomaniak free tier is 60.'
    type: int
    default: 0

  meilisearch.embedder.precompute:
    label: 'Precompute embeddings in PHP'
    description: 'When true, PHP fetches the embedding from the configured provider before saveDocument and writes it into _vectors.default. The embedder on the Meilisearch index is registered as `userProvided`. Use this when the provider rate-limits per minute and Meilisearch internal auto-batching would otherwise burst past the cap. Pairs with meilisearch.indexing.requestsPerMinute.'
    type: bool
    default: false

  meilisearch.indexing.contentLanguageAllowList:
    label: 'Allowed detected content languages'
    description: 'ISO 639-1 codes (lowercase, e.g. ["de", "en", "fr", "nl"]) the LanguageDetector is allowed to assign. A detection landing outside this list is dropped to "" (unknown), so a fluke "ko" or "klingon" guess on short text never poisons the index. Leave empty to accept any detected code.'
    type: stringlist
    default: []

  meilisearch.indexing.zeroDowntime:
    label: 'Zero-downtime reindex (atomic index swap)'
    description: 'When true, ws_meilisearch:reindex writes into a `<index>_draft` index and atomically swaps it into the primary on completion. Visitors keep seeing the previous corpus throughout the reindex — no `no_context` window. Disabled by default: the legacy drop-and-rebuild on the primary is simpler and uses less disk (draft + primary briefly coexist while writing). Enable on production sites where the reindex takes long enough that visitor-facing blank-result windows are unacceptable.'
    type: bool
    default: false

  meilisearch.indexing.skipFalForBrokenStorage:
    label: 'Skip FAL indexing on broken storage'
    description: 'Emergency bypass: when true, the FileSchemaProvider returns no documents at all. Use this when the FAL storage backend has tombstoned/missing objects (NoSuchKey / 404) for many sys_file rows — each broken row otherwise triggers AWS-SDK retries and stalls the reindex for hours before News / KR / Pages get a chance. Turn off again once sys_file is cleaned up.'
    type: bool
    default: false

  meilisearch.rag.timeout:
    label: 'RAG LLM timeout (seconds)'
    description: 'HTTP timeout for the LLM chat completion call. 60 s suffices for small models / short answers; raise to 120–180 for large models (Scaleway mistral-medium-3.5-128b, Anthropic Sonnet, …) generating long answers from a big RAG context.'
    type: int
    default: 60

  meilisearch.rag.maxTokens:
    label: 'RAG LLM max completion tokens'
    description: 'Hard cap on the number of tokens the LLM may generate. 0 = no cap (provider default). Set this to bound answer length and stop runaway generations that exceed the HTTP timeout. Reasonable starting point: 600–1000 for instruction-following answers with citations.'
    type: int
    default: 0

  meilisearch.rag.stripStopWords:
    label: 'Strip stop-words from RAG queries'
    description: 'When true, the client-side stop-word stripper runs against RAG-retrieval queries — turning "Wie kann ich die Lizenzdatei automatisch importieren?" into "Lizenzdatei automatisch importieren" before it reaches Meilisearch. Defaults on; raise the relevant fach-tokens above common-word matches. Turn off only when your queries are already short and you rely on multi-word synonym expansion ("gebe frei" → "freigeben") which the stripped form would defeat.'
    type: bool
    default: true

  meilisearch.rag.stopWords:
    label: 'RAG-specific stop-words'
    description: 'Override the index-wide stopWords for RAG-retrieval stripping. Use this to keep brand / product / domain-verb tokens in the query while still removing generic question / function words ("wie", "kann", "ich", "der", "die", …). Leave empty to reuse the index-side list. The override is consulted only when meilisearch.rag.stripStopWords is on.'
    type: stringlist
    default: []

  meilisearch.rag.matchingStrategy:
    label: 'RAG matching strategy'
    description: 'Meilisearch matchingStrategy used by RAG retrieval. "frequency" drops the highest-frequency tokens first — needed for verb-led question queries ("Wie gebe ich …", "Was ist …") where the leading token does not appear in any KR title. "last" (Meilisearch default) drops only trailing tokens and returns zero hits when the leading token is the misfit. Set to empty string to inherit the Meilisearch index default.'
    type: string
    default: 'frequency'

  meilisearch.search.matchingStrategy:
    label: 'FE search matching strategy'
    description: 'Meilisearch matchingStrategy used by frontend search. "all" requires every query token (strict AND) — matches user intent for short brand/product queries (e.g. a two-word brand) where a doc that only mentions one of the tokens should NOT appear. "last" (Meilisearch default) drops trailing tokens, behaving OR-like and surfacing partially-matching docs. Set to empty string to inherit the Meilisearch index default.'
    type: string
    default: 'all'

  meilisearch.tika.allowedMimeTypes:
    label: 'Tika allowed mime types'
    description: 'Whitelist of mime types eligible for text extraction. Everything else is skipped.'
    type: stringlist
    default:
      - 'application/pdf'
      - 'application/msword'
      - 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      - 'application/vnd.ms-excel'
      - 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      - 'application/vnd.ms-powerpoint'
      - 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
      - 'application/rtf'
      - 'application/vnd.oasis.opendocument.text'
      - 'application/vnd.oasis.opendocument.spreadsheet'
      - 'application/vnd.oasis.opendocument.presentation'
      - 'application/epub+zip'
      - 'text/plain'
      - 'text/html'
      - 'text/markdown'

  meilisearch.embedder.source:
    label: 'Embedder source'
    description: 'Vector embedder for hybrid (keyword + semantic) search. Leave empty to disable — queries fall back to pure keyword search. Supported: openAi, huggingFace, ollama, rest, userProvided, infomaniak (preset → resolves to openAi against the Infomaniak AI Tools endpoint; only needs apiKey + model + meilisearch.infomaniak.productId).'
    type: string
    default: ''

  meilisearch.embedder.model:
    label: 'Embedder model'
    description: 'Model identifier passed to the embedder. Examples: "text-embedding-3-small" (openAi), "BAAI/bge-base-en-v1.5" (huggingFace), "nomic-embed-text" (ollama).'
    type: string
    default: ''

  meilisearch.embedder.url:
    label: 'Embedder URL'
    description: 'HTTP endpoint for ollama / rest sources. Ignored for openAi and huggingFace. Example: http://ollama:11434/api/embeddings.'
    type: string
    default: ''

  meilisearch.embedder.apiKey:
    label: 'Embedder API key'
    description: 'Auth token for openAi / rest sources. Ignored for huggingFace and ollama.'
    type: string
    default: ''

  meilisearch.embedder.dimensions:
    label: 'Embedder dimensions'
    description: 'Vector dimensions. 0 = auto-detect (works for known openAi / huggingFace / ollama models). Must be set explicitly for rest / userProvided.'
    type: int
    default: 0

  meilisearch.embedder.documentTemplate:
    label: 'Document template'
    description: 'Liquid template determining which fields get embedded. Keep it short — most embedders cap input around 512 tokens.'
    type: text
    default: "{{ doc.title }}. {{ doc.description }}. {{ doc.bodytext }}"

  meilisearch.embedder.semanticRatio:
    label: 'Semantic ratio (0..1)'
    description: 'Default weight of semantic vs. keyword scoring when hybrid search is used. 0 = pure keyword, 1 = pure semantic, 0.5 = balanced. The frontend can override per request.'
    type: number
    default: 0.5

  meilisearch.rag.provider:
    label: 'RAG LLM provider'
    description: 'Large-language-model provider for retrieval-augmented generation. Leave empty to disable the RAG plugin. Supported: openAi, anthropic, ollama, rest (any OpenAI-compatible chat completions endpoint), infomaniak (Swiss sovereign AI Tools — only needs apiKey + model + meilisearch.infomaniak.productId).'
    type: string
    default: ''

  meilisearch.infomaniak.productId:
    label: 'Infomaniak AI product id'
    description: 'Numeric product id of your Infomaniak AI Tools subscription. Visible in the Manager URL when opening the product (e.g. /manager/.../ai-tools/PRODUCT_ID). Used by both the "infomaniak" embedder preset and the "infomaniak" RAG provider to derive the OpenAI-compatible endpoint URL automatically.'
    type: string
    default: ''

  meilisearch.rag.url:
    label: 'RAG provider URL'
    description: 'HTTP endpoint for ollama / rest providers. Ignored for openAi and anthropic — those use the official API URLs. Example for Ollama: http://ollama:11434.'
    type: string
    default: ''

  meilisearch.rag.apiKey:
    label: 'RAG provider API key'
    description: 'Auth token for openAi / anthropic / rest. Ignored for ollama.'
    type: string
    default: ''

  meilisearch.rag.model:
    label: 'RAG model'
    description: 'Model identifier. Examples: "gpt-4o-mini" (openAi), "claude-haiku-4-5" (anthropic), "llama3.1:8b" (ollama).'
    type: string
    default: ''

  meilisearch.rag.maxContextHits:
    label: 'Max context hits'
    description: 'How many top-ranked search hits to feed into the LLM as context. Higher = better grounding but more tokens. Defaults to 5.'
    type: int
    default: 5

  meilisearch.rag.maxContextChars:
    label: 'Max characters per context hit'
    description: 'Per-hit body truncation. Prevents one huge document from blowing the LLM context window. Defaults to 1500.'
    type: int
    default: 1500

  meilisearch.rag.temperature:
    label: 'LLM temperature'
    description: 'Sampling temperature passed to the LLM. Low values (0.0-0.3) yield more grounded, deterministic answers. RAG normally benefits from low temperature.'
    type: number
    default: 0.2

  meilisearch.rag.systemPrompt:
    label: 'System prompt'
    description: 'System message that instructs the LLM how to answer. Reference {{language}} for the site language label.'
    type: text
    default: "You are a helpful site assistant. Answer the user's question strictly using the provided context excerpts. If the answer cannot be derived from the context, say so. Cite each fact by appending [id] markers that match the IDs in the context. Respond in the user's language."

  meilisearch.rag.conversationalRewrite:
    label: 'RAG: conversational query rewriting'
    description: 'When true, a follow-up question in a multi-turn chat is rewritten into a self-contained search query using the conversation history before retrieval (one extra short LLM call). Fixes elliptical follow-ups ("und der Preis?") that would otherwise retrieve the wrong context. Retrieval only — the answer still uses the original wording. No effect on the first turn (no history).'
    type: bool
    default: true

  meilisearch.rag.rewriteHistoryTurns:
    label: 'RAG: history turns used for query rewriting'
    description: 'How many of the most recent conversation turns are shown to the rewriting model when reformulating a follow-up into a standalone search query. Higher values resolve longer-range references at the cost of a larger rewrite prompt.'
    type: int
    default: 3

  meilisearch.rag.suggestions.enabled:
    label: 'RAG: action suggestions under the answer'
    description: 'When true, after each answer one short extra LLM call proposes up to N actionable buttons: follow-up questions, narrower search queries, and pointers to retrieved sources. Optional + safe — when disabled or on any error no suggestions are shown and the answer is unaffected.'
    type: bool
    default: true

  meilisearch.rag.suggestions.max:
    label: 'RAG: max action suggestions'
    description: 'Upper bound on how many suggestion buttons are shown under an answer (1–8).'
    type: int
    default: 4

  meilisearch.rag.useHybrid:
    label: 'Use hybrid search for retrieval'
    description: 'When true, RAG retrieval uses hybrid (keyword + semantic) search instead of keyword-only. Requires a configured embedder. Ignored when no embedder is configured.'
    type: bool
    default: true

  meilisearch.rag.semanticRatio:
    label: 'RAG retrieval: semantic ratio'
    description: 'Per-RAG override for `meilisearch.embedder.semanticRatio`. RAG questions usually need a small semantic kick to bridge morphological gaps ("gebe ... frei" → "freigeben") that pure keyword retrieval misses, but too much semantic weight drowns the actually-relevant KR title under generic-sounding neighbours. 0.3 has tested well on a German technical-documentation corpus with mini_lm_l12_v2; raise carefully and monitor regressions with the RAG test suite. Falls back to the embedder default when unset.'
    type: number
    default: 0.3

  meilisearch.rag.restrictToKnowledgeResources:
    label: 'RAG: restrict retrieval to knowledge_resource'
    description: 'When true, the RAG retriever filters context to `type = knowledge_resource`. Use when the site has a curated Knowledge Resources corpus (DITA-OT import) — keeps files / pages / news from outranking purpose-built grounding docs. Default off so the feature works on installs without a Knowledge Resources corpus.'
    type: bool
    default: false

  meilisearch.rag.conversation.enabled:
    label: 'Multi-turn conversation memory'
    description: 'When enabled, the RAG plugin keeps the last N (question, answer) pairs in the anonymous frontend user session and feeds them back to the LLM, so visitors can ask follow-ups without restating context. Default: disabled — each question is independent.'
    type: bool
    default: false

  meilisearch.rag.conversation.maxTurns:
    label: 'Max conversation turns'
    description: 'How many prior (question, answer) pairs to remember. Higher = better context but more tokens (and slower / costlier per call). Default 3.'
    type: int
    default: 3

  meilisearch.rag.conversation.sessionKey:
    label: 'Session key'
    description: 'Storage key in the frontend session. Change if multiple RAG plugins on the same site should keep independent conversation states.'
    type: string
    default: 'ws_meilisearch_rag_conversation'

  # ---------------------------------------------------------------------
  # Relevance & index-level Meilisearch settings.
  #
  # These are pushed to the Meilisearch index by `ws_meilisearch:apply-settings`.
  # SEAL itself only manages field declarations (searchable/filterable/sortable
  # flags via SchemaProvider::getAdditionalFields). Everything below — ranking
  # rules, typo tolerance, stop words, synonyms, distinctAttribute, pagination,
  # faceting limits, searchCutoffMs — has to be configured separately.
  #
  # Structural defaults (synonyms map, facet panel definitions, per-type
  # display config) live in settings.yaml in the same Set, because typed Site
  # Settings have no shape for list-of-maps.
  # ---------------------------------------------------------------------

  meilisearch.defaults.rankingRules:
    label: 'Ranking rules order'
    description: 'Meilisearch ranking rules in priority order — earlier rules win ties. Standard set: words, typo, proximity, attribute, sort, exactness. Add custom rules as "<field>:asc" / "<field>:desc" (e.g. "datetime:desc" for newest-first as a tiebreaker).'
    type: stringlist
    default:
      - words
      - typo
      - proximity
      - attribute
      - sort
      - exactness

  meilisearch.defaults.typoTolerance.enabled:
    label: 'Typo tolerance: enabled'
    description: 'When false, queries match only exact word forms.'
    type: bool
    default: true

  meilisearch.defaults.typoTolerance.minWordSizeForOneTypo:
    label: 'Typo tolerance: min word size for 1 typo'
    description: 'Words shorter than this require an exact match. Default 5.'
    type: int
    default: 5

  meilisearch.defaults.typoTolerance.minWordSizeForTwoTypos:
    label: 'Typo tolerance: min word size for 2 typos'
    description: 'Words shorter than this allow at most 1 typo. Default 9.'
    type: int
    default: 9

  meilisearch.defaults.typoTolerance.disableOnAttributes:
    label: 'Typo tolerance: disable on attributes'
    description: 'Attributes where typo tolerance must be off (e.g. "sku", "isbn", "uri", "searchToken"). Empty = typo tolerance is active on every searchable attribute. `searchToken` (the per-image identifier the suggest dropdown searches for) is included by default so q=<token> narrows to exactly one image.'
    type: stringlist
    default:
      - 'searchToken'

  meilisearch.defaults.typoTolerance.disableOnWords:
    label: 'Typo tolerance: disable on words'
    description: 'Words that must NEVER be fuzzy-matched (treated as exact-only). Use for brand / product / domain tokens visitors type intentionally — e.g. your own brand name, product family names, and any third-party tool names that appear in your content. Without this, a 1-typo near-spelling can match the brand token (length ≥5) and bury the actual hits under unrelated near-misses. Tokens are case-insensitive and apply to indexing-time tokenisation, so the corpus does not need to be re-indexed to add a new word.'
    type: stringlist
    default: []

  meilisearch.defaults.typoTolerance.disableOnNumbers:
    label: 'Typo tolerance: disable on numeric tokens'
    description: 'When true, Meilisearch never fuzzy-matches tokens that are pure digits — useful for version numbers / SKUs / part numbers where "24" and "14" must be distinguishable. Requires Meilisearch v1.12 or later; ignored on older engines.'
    type: bool
    default: false

  meilisearch.defaults.stopWords:
    label: 'Stop words'
    description: 'Words ignored during indexing and querying. Use the site language(s) — e.g. "der, die, das, und, oder, mit" for German.'
    type: stringlist
    default: []

  meilisearch.defaults.distinctAttribute:
    label: 'Distinct attribute'
    description: 'Field used to deduplicate hits: only one document per distinct value is returned (e.g. "groupId" for product variants). Leave empty for no deduplication.'
    type: string
    default: ''

  meilisearch.defaults.displayedAttributes:
    label: 'Displayed attributes'
    description: 'Fields returned in search hits. Use ["*"] for everything (default). Narrow only if you want to enforce a strict field projection across all clients.'
    type: stringlist
    default: ['*']

  meilisearch.defaults.pagination.maxTotalHits:
    label: 'Pagination: max total hits'
    description: 'Upper cap on totalHits Meilisearch will report. Lowering this speeds up huge indexes at the cost of accurate deep-page counts. Default 1000.'
    type: int
    default: 1000

  meilisearch.defaults.faceting.maxValuesPerFacet:
    label: 'Faceting: max values per facet'
    description: 'How many distinct facet values are returned per attribute. Default 100. Raise for high-cardinality attributes like brand catalogues.'
    type: int
    default: 100

  meilisearch.defaults.faceting.sortFacetValuesBy:
    label: 'Faceting: default sort'
    description: 'Default value ordering across facets — "count" = by count descending (most common first), "alpha" = alphabetical ascending. Per-facet override via meilisearch.facets[*].sort in settings.yaml.'
    type: string
    default: 'count'

  meilisearch.defaults.searchCutoffMs:
    label: 'Search cutoff (ms)'
    description: 'Hard cap on query execution time. Meilisearch returns partial results once the cutoff hits. 0 = unlimited (engine default).'
    type: int
    default: 0

  # ---------------------------------------------------------------------
  # Frontend defaults.
  #
  # Consumed by SearchController + SearchService when a per-plugin TypoScript
  # override is absent. Changing these affects every site-level search box
  # that doesn't override them in plugin.tx_wsmeilisearch_search.settings.
  # ---------------------------------------------------------------------

  meilisearch.frontend.perPage:
    label: 'Default hits per page'
    description: 'Default page size when the plugin TypoScript does not set settings.perPage. Per-plugin TS still wins.'
    type: int
    default: 20

  meilisearch.frontend.highlightPreTag:
    label: 'Highlight: pre tag'
    description: 'HTML opening tag wrapped around matched substrings in snippets.'
    type: string
    default: '<mark>'

  meilisearch.frontend.highlightPostTag:
    label: 'Highlight: post tag'
    description: 'HTML closing tag wrapped around matched substrings in snippets.'
    type: string
    default: '</mark>'

  meilisearch.frontend.cropMarker:
    label: 'Snippet: crop marker'
    description: 'Marker inserted where snippet text is cut off (e.g. "…", "...").'
    type: string
    default: '…'

  meilisearch.frontend.cropLength:
    label: 'Snippet: crop length (words)'
    description: 'Words around the match in cropped snippets. Default 200 (matches the previous hardcoded value in SearchService).'
    type: int
    default: 200

  # ---------------------------------------------------------------------
  # Apply-settings command behaviour.
  # ---------------------------------------------------------------------

  meilisearch.sync.waitForTasks:
    label: 'Wait for Meilisearch tasks'
    description: 'When true, ws_meilisearch:apply-settings blocks until every Meilisearch task completes (recommended in CI / deploy hooks). Disable for fire-and-forget operation.'
    type: bool
    default: true

  # ---------------------------------------------------------------------
  # Editor-controlled relevance boost.
  #
  # Documents carry a `boost` float field that composites the per-type
  # multiplier (meilisearch.boosts.types.<type> in settings.yaml) with the
  # per-record TCA enum tx_wsmeilisearch_boost on pages / tx_news. The
  # boost is always written; it only influences ranking once an integrator
  # adds "boost:desc" to meilisearch.defaults.rankingRules (between
  # "attribute" and "sort" is the natural slot).
  # ---------------------------------------------------------------------

  meilisearch.boosts.recordOverrideEnabled:
    label: 'Honor per-record boost (TCA tx_wsmeilisearch_boost)'
    description: 'When true, indexers read the editor-set boost field on pages and news records and multiply it into the document boost. Disable to ignore the BE control and rely on per-type defaults only.'
    type: bool
    default: true

  meilisearch.accessControl.enabled:
    label: 'Filter search results by FE-user groups'
    description: 'When true, every search / suggest / RAG call adds a `(accessGroups IS EMPTY OR accessGroups IN [<visitor groupIds>])` filter so docs marked with fe_group restrictions only surface for visitors with a matching group. Indexers write the accessGroups int[] on every doc (page fe_group, sys_file_metadata.fe_groups, tx_news_domain_model_news.fe_group; knowledge_resource is always public). Disable for BE-style indexes where editors must see everything regardless of visitor.'
    type: bool
    default: true