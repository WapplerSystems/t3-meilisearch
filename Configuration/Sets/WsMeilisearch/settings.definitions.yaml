settings:
  meilisearch.url:
    label: 'Meilisearch URL'
    description: 'HTTP endpoint of the Meilisearch server (e.g. http://meilisearch:7700).'
    type: string
    default: 'http://meilisearch:7700'

  meilisearch.apiKey:
    label: 'Meilisearch master / API key'
    description: 'Master key (development) or scoped API key (production) for the Meilisearch server.'
    type: string
    default: ''

  meilisearch.indexPrefix:
    label: 'Index prefix'
    description: 'Prefix for all indexes managed by this site (e.g. "site1_"). Keeps multiple sites or environments isolated on the same Meilisearch server.'
    type: string
    default: ''

  meilisearch.restrictToCurrentLanguage:
    label: 'Restrict results to current language'
    description: 'When enabled, the search plugin force-filters results to the active site language and hides the language facet from the visitor. Use this on per-language search pages where the language choice would just be noise.'
    type: bool
    default: false

  meilisearch.indexedTables:
    label: 'Indexed record types'
    description: 'Comma-separated list of TCA tables to index. Pages, tx_news and tx_wsmeilisearch_helpdoc (help topics imported via ws_meilisearch:import-help-docs) are wired by default.'
    type: string
    default: 'pages,tx_news_domain_model_news,tx_wsmeilisearch_helpdoc'

  meilisearch.helpdoc.sourceRoot:
    label: 'Help topic source root'
    description: 'On-disk path (absolute or relative to the project root) of the DITA-OT XHTML corpus served under /hilfe/. Files outside this root are not reachable. Leave empty to disable the /hilfe/ middleware.'
    type: string
    default: ''

  meilisearch.helpdoc.fileadminFolder:
    label: 'Help topic FAL target folder'
    description: 'Default FAL combined identifier (e.g. 1:/helpdocs/) where importers store uploaded files and extracted media. Operators can override per import via the BE folder picker. The folder is auto-created on first use.'
    type: string
    default: '1:/helpdocs/'

  # --- Quota check (ws_meilisearch:check-quotas) -----------------------
  # Run periodically (cron / scheduler) against Infomaniak / OpenAI /
  # Anthropic to catch usage approaching the cap before it bites.

  meilisearch.quota.threshold:
    label: 'Quota warning threshold (%)'
    description: 'Percent of cap that triggers the warning email when ws_meilisearch:check-quotas runs. Default 80 — leaves enough runway to top up the plan before the hard cap.'
    type: int
    default: 80

  meilisearch.quota.recipient:
    label: 'Quota warning email recipient'
    description: 'Where warning emails go when a provider exceeds the threshold. Empty disables the email — the CLI still prints the table for log scraping. Single address or comma-separated list.'
    type: string
    default: ''

  # OpenAI's usage endpoint needs an Admin API key (sk-admin-…), NOT the
  # completion key used by the RAG provider — separate scope, separate
  # storage so a key rotation on one doesn't blast the other.
  meilisearch.quota.openai.adminKey:
    label: 'OpenAI admin API key (for quota check only)'
    description: 'Admin-scoped key (starts with sk-admin-...) needed by /v1/organization/usage/completions. NOT the same as meilisearch.rag.apiKey.'
    type: string
    default: ''
  meilisearch.quota.openai.monthlyCap:
    label: 'OpenAI monthly token cap'
    description: 'Operator-set cap in tokens; OpenAI returns usage but no quota number, so this is the value the threshold is measured against. Set to your monthly budget in tokens.'
    type: int
    default: 0

  # Same shape for Anthropic — admin key is separate from the completion
  # key, and the cap is operator-set since Anthropic doesn't expose
  # account-level quotas via API.
  meilisearch.quota.anthropic.adminKey:
    label: 'Anthropic admin API key (for quota check only)'
    description: 'Admin-scoped key needed by /v1/organizations/usage_report. NOT the same as meilisearch.rag.apiKey.'
    type: string
    default: ''
  meilisearch.quota.anthropic.monthlyCap:
    label: 'Anthropic monthly token cap'
    description: 'Operator-set cap in tokens; Anthropic returns usage but no quota number, so this is the value the threshold is measured against.'
    type: int
    default: 0

  # Infomaniak exposes NO usage API for AI Tools (verified 2026-06-07,
  # see the long comment in InfomaniakQuotaProvider). This token is
  # only used to confirm token validity + product reachability via
  # /1/ai. Quota numbers themselves must be read from the Manager UI.
  meilisearch.quota.infomaniak.apiToken:
    label: 'Infomaniak Manager API token (reachability check only)'
    description: 'Optional. Personal Access Token from manager.infomaniak.com → API. Used to confirm the AI product is reachable; Infomaniak does not expose a usage API so actual quota numbers must be read at manager.infomaniak.com → AI Tools.'
    type: string
    default: ''

  # --- RAG fallback contact info ---------------------------------------
  # Rendered below the RAG answer card so visitors have a way to reach a
  # human when the model has no good answer (or always, per .show below).

  meilisearch.rag.fallback.show:
    label: 'When to show the fallback contact'
    description: 'onlyEmpty = render only when the RAG pipeline returned no_context / failed / low-confidence (no citations). always = render under every answer. never = hide entirely.'
    type: string
    enum:
      onlyEmpty: 'Only when no answer / low confidence'
      always: 'Under every answer'
      never: 'Never (hide)'
    default: 'onlyEmpty'

  meilisearch.rag.fallback.contactName:
    label: 'Contact name / organisation'
    description: 'Optional heading above the contact details (e.g. "LINEAR Support" or "Anna Beispiel"). Empty hides the heading.'
    type: string
    default: ''

  meilisearch.rag.fallback.email:
    label: 'Fallback email address'
    description: 'Rendered as mailto: link. The visitor''s current question is pre-filled as the subject when they click. Empty hides the email row.'
    type: string
    default: ''

  meilisearch.rag.fallback.phone:
    label: 'Fallback phone number'
    description: 'Rendered as tel: link. Display value stays as typed; the href strips spaces / dashes so dialers don''t choke. Empty hides the phone row.'
    type: string
    default: ''

  meilisearch.rag.fallback.ticketUrl:
    label: 'Ticket system URL'
    description: 'Optional URL to a ticket system (Jira, Redmine, Zammad, …). Renders as a button "Open a ticket" when set.'
    type: string
    default: ''

  meilisearch.deduplicateFiles:
    label: 'Dedupe FAL files by site'
    description: 'When enabled, FAL files are only indexed into a site if they are actually referenced from a page belonging to that site (via sys_file_reference → page → site). Disabled by default so every site indexes every non-missing file — backward compatible with the original FAL-indexing rollout. Enable for production sites that share a Meilisearch server but want strict per-site search results.'
    type: bool
    default: false

  meilisearch.tika.url:
    label: 'Apache Tika Server URL'
    description: 'HTTP endpoint of an Apache Tika Server for text extraction from PDF / Office / RTF / EPUB files. Leave empty to disable FAL indexing entirely.'
    type: string
    default: 'http://tika:9998'

  meilisearch.tika.timeout:
    label: 'Tika request timeout (seconds)'
    description: 'How long to wait for a single file extraction before giving up. Heavy PDFs / scanned documents can take 30+ s.'
    type: int
    default: 60

  meilisearch.tika.maxFileSize:
    label: 'Tika max file size (bytes)'
    description: 'Files larger than this are skipped without contacting Tika. Default 50 MB.'
    type: int
    default: 52428800

  meilisearch.tika.ocrEnabled:
    label: 'Enable OCR'
    description: 'When true, the indexer asks Tika to OCR scanned PDFs and image files. Requires the "apache/tika:*-full" image (with Tesseract installed) — the base image rejects OCR-related headers with HTTP 400, so leave this off unless you switched to the full tag.'
    type: bool
    default: false

  meilisearch.tika.ocrLanguage:
    label: 'OCR language(s)'
    description: 'Tesseract language codes for OCR, comma-separated. Examples: "eng", "deu", "eng+deu". Only sent when ocrEnabled is true.'
    type: string
    default: 'eng'

  meilisearch.tika.ocrStrategy:
    label: 'PDF OCR strategy'
    description: 'How Tika decides whether to OCR a PDF. "no_ocr" = trust the embedded text layer (fast). "auto" = OCR only when the embedded text looks empty. "ocr_and_text_extraction" = always do both and concatenate (slow but thorough). "ocr_only" = ignore the embedded text layer entirely. Only sent when ocrEnabled is true.'
    type: string
    default: 'auto'

  meilisearch.indexing.allowedExtensions:
    label: 'Allowed file extensions'
    description: 'Whitelist of lower-case file extensions to include in the index. When non-empty, ONLY these extensions are indexed and excludeExtensions is ignored. Example: [pdf, docx, doc, html, htm, md, txt, rtf, odt, epub]. Empty by default — falls back to the excludeExtensions blacklist.'
    type: stringlist
    default: []

  meilisearch.indexing.excludeExtensions:
    label: 'Excluded file extensions'
    description: 'Blacklist applied when allowedExtensions is empty. Use for config / log / backup files that pollute the search corpus. Example: [yaml, yml, log, bak, tmp]. Ignored when allowedExtensions is non-empty.'
    type: stringlist
    default: []

  meilisearch.indexing.minImageSizeKb:
    label: 'Minimum image size (KB)'
    description: 'Skip image files (mime starts with image/) smaller than this. Filters out icons / flags / decorative graphics that pollute the search corpus without being useful as results. 10 catches most icons; 50 also catches small previews. Default 0 = no size filter.'
    type: int
    default: 0

  meilisearch.tika.allowedMimeTypes:
    label: 'Tika allowed mime types'
    description: 'Whitelist of mime types eligible for text extraction. Everything else is skipped.'
    type: stringlist
    default:
      - 'application/pdf'
      - 'application/msword'
      - 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      - 'application/vnd.ms-excel'
      - 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      - 'application/vnd.ms-powerpoint'
      - 'application/vnd.openxmlformats-officedocument.presentationml.presentation'
      - 'application/rtf'
      - 'application/vnd.oasis.opendocument.text'
      - 'application/vnd.oasis.opendocument.spreadsheet'
      - 'application/vnd.oasis.opendocument.presentation'
      - 'application/epub+zip'
      - 'text/plain'
      - 'text/html'
      - 'text/markdown'

  meilisearch.embedder.source:
    label: 'Embedder source'
    description: 'Vector embedder for hybrid (keyword + semantic) search. Leave empty to disable — queries fall back to pure keyword search. Supported: openAi, huggingFace, ollama, rest, userProvided, infomaniak (preset → resolves to openAi against the Infomaniak AI Tools endpoint; only needs apiKey + model + meilisearch.infomaniak.productId).'
    type: string
    default: ''

  meilisearch.embedder.model:
    label: 'Embedder model'
    description: 'Model identifier passed to the embedder. Examples: "text-embedding-3-small" (openAi), "BAAI/bge-base-en-v1.5" (huggingFace), "nomic-embed-text" (ollama).'
    type: string
    default: ''

  meilisearch.embedder.url:
    label: 'Embedder URL'
    description: 'HTTP endpoint for ollama / rest sources. Ignored for openAi and huggingFace. Example: http://ollama:11434/api/embeddings.'
    type: string
    default: ''

  meilisearch.embedder.apiKey:
    label: 'Embedder API key'
    description: 'Auth token for openAi / rest sources. Ignored for huggingFace and ollama.'
    type: string
    default: ''

  meilisearch.embedder.dimensions:
    label: 'Embedder dimensions'
    description: 'Vector dimensions. 0 = auto-detect (works for known openAi / huggingFace / ollama models). Must be set explicitly for rest / userProvided.'
    type: int
    default: 0

  meilisearch.embedder.documentTemplate:
    label: 'Document template'
    description: 'Liquid template determining which fields get embedded. Keep it short — most embedders cap input around 512 tokens.'
    type: text
    default: "{{ doc.title }}. {{ doc.description }}. {{ doc.bodytext }}"

  meilisearch.embedder.semanticRatio:
    label: 'Semantic ratio (0..1)'
    description: 'Default weight of semantic vs. keyword scoring when hybrid search is used. 0 = pure keyword, 1 = pure semantic, 0.5 = balanced. The frontend can override per request.'
    type: number
    default: 0.5

  meilisearch.rag.provider:
    label: 'RAG LLM provider'
    description: 'Large-language-model provider for retrieval-augmented generation. Leave empty to disable the RAG plugin. Supported: openAi, anthropic, ollama, rest (any OpenAI-compatible chat completions endpoint), infomaniak (Swiss sovereign AI Tools — only needs apiKey + model + meilisearch.infomaniak.productId).'
    type: string
    default: ''

  meilisearch.infomaniak.productId:
    label: 'Infomaniak AI product id'
    description: 'Numeric product id of your Infomaniak AI Tools subscription. Visible in the Manager URL when opening the product (e.g. /manager/.../ai-tools/PRODUCT_ID). Used by both the "infomaniak" embedder preset and the "infomaniak" RAG provider to derive the OpenAI-compatible endpoint URL automatically.'
    type: string
    default: ''

  meilisearch.rag.url:
    label: 'RAG provider URL'
    description: 'HTTP endpoint for ollama / rest providers. Ignored for openAi and anthropic — those use the official API URLs. Example for Ollama: http://ollama:11434.'
    type: string
    default: ''

  meilisearch.rag.apiKey:
    label: 'RAG provider API key'
    description: 'Auth token for openAi / anthropic / rest. Ignored for ollama.'
    type: string
    default: ''

  meilisearch.rag.model:
    label: 'RAG model'
    description: 'Model identifier. Examples: "gpt-4o-mini" (openAi), "claude-haiku-4-5" (anthropic), "llama3.1:8b" (ollama).'
    type: string
    default: ''

  meilisearch.rag.maxContextHits:
    label: 'Max context hits'
    description: 'How many top-ranked search hits to feed into the LLM as context. Higher = better grounding but more tokens. Defaults to 5.'
    type: int
    default: 5

  meilisearch.rag.maxContextChars:
    label: 'Max characters per context hit'
    description: 'Per-hit body truncation. Prevents one huge document from blowing the LLM context window. Defaults to 1500.'
    type: int
    default: 1500

  meilisearch.rag.temperature:
    label: 'LLM temperature'
    description: 'Sampling temperature passed to the LLM. Low values (0.0-0.3) yield more grounded, deterministic answers. RAG normally benefits from low temperature.'
    type: number
    default: 0.2

  meilisearch.rag.systemPrompt:
    label: 'System prompt'
    description: 'System message that instructs the LLM how to answer. Reference {{language}} for the site language label.'
    type: text
    default: "You are a helpful site assistant. Answer the user's question strictly using the provided context excerpts. If the answer cannot be derived from the context, say so. Cite each fact by appending [id] markers that match the IDs in the context. Respond in the user's language."

  meilisearch.rag.useHybrid:
    label: 'Use hybrid search for retrieval'
    description: 'When true, RAG retrieval uses hybrid (keyword + semantic) search instead of keyword-only. Requires a configured embedder. Ignored when no embedder is configured.'
    type: bool
    default: true

  meilisearch.rag.conversation.enabled:
    label: 'Multi-turn conversation memory'
    description: 'When enabled, the RAG plugin keeps the last N (question, answer) pairs in the anonymous frontend user session and feeds them back to the LLM, so visitors can ask follow-ups without restating context. Default: disabled — each question is independent.'
    type: bool
    default: false

  meilisearch.rag.conversation.maxTurns:
    label: 'Max conversation turns'
    description: 'How many prior (question, answer) pairs to remember. Higher = better context but more tokens (and slower / costlier per call). Default 3.'
    type: int
    default: 3

  meilisearch.rag.conversation.sessionKey:
    label: 'Session key'
    description: 'Storage key in the frontend session. Change if multiple RAG plugins on the same site should keep independent conversation states.'
    type: string
    default: 'ws_meilisearch_rag_conversation'

  # ---------------------------------------------------------------------
  # Relevance & index-level Meilisearch settings.
  #
  # These are pushed to the Meilisearch index by `ws_meilisearch:apply-settings`.
  # SEAL itself only manages field declarations (searchable/filterable/sortable
  # flags via SchemaProvider::getAdditionalFields). Everything below — ranking
  # rules, typo tolerance, stop words, synonyms, distinctAttribute, pagination,
  # faceting limits, searchCutoffMs — has to be configured separately.
  #
  # Structural defaults (synonyms map, facet panel definitions, per-type
  # display config) live in settings.yaml in the same Set, because typed Site
  # Settings have no shape for list-of-maps.
  # ---------------------------------------------------------------------

  meilisearch.defaults.rankingRules:
    label: 'Ranking rules order'
    description: 'Meilisearch ranking rules in priority order — earlier rules win ties. Standard set: words, typo, proximity, attribute, sort, exactness. Add custom rules as "<field>:asc" / "<field>:desc" (e.g. "datetime:desc" for newest-first as a tiebreaker).'
    type: stringlist
    default:
      - words
      - typo
      - proximity
      - attribute
      - sort
      - exactness

  meilisearch.defaults.typoTolerance.enabled:
    label: 'Typo tolerance: enabled'
    description: 'When false, queries match only exact word forms.'
    type: bool
    default: true

  meilisearch.defaults.typoTolerance.minWordSizeForOneTypo:
    label: 'Typo tolerance: min word size for 1 typo'
    description: 'Words shorter than this require an exact match. Default 5.'
    type: int
    default: 5

  meilisearch.defaults.typoTolerance.minWordSizeForTwoTypos:
    label: 'Typo tolerance: min word size for 2 typos'
    description: 'Words shorter than this allow at most 1 typo. Default 9.'
    type: int
    default: 9

  meilisearch.defaults.typoTolerance.disableOnAttributes:
    label: 'Typo tolerance: disable on attributes'
    description: 'Attributes where typo tolerance must be off (e.g. "sku", "isbn", "uri"). Empty = typo tolerance is active on every searchable attribute.'
    type: stringlist
    default: []

  meilisearch.defaults.stopWords:
    label: 'Stop words'
    description: 'Words ignored during indexing and querying. Use the site language(s) — e.g. "der, die, das, und, oder, mit" for German.'
    type: stringlist
    default: []

  meilisearch.defaults.distinctAttribute:
    label: 'Distinct attribute'
    description: 'Field used to deduplicate hits: only one document per distinct value is returned (e.g. "groupId" for product variants). Leave empty for no deduplication.'
    type: string
    default: ''

  meilisearch.defaults.displayedAttributes:
    label: 'Displayed attributes'
    description: 'Fields returned in search hits. Use ["*"] for everything (default). Narrow only if you want to enforce a strict field projection across all clients.'
    type: stringlist
    default: ['*']

  meilisearch.defaults.pagination.maxTotalHits:
    label: 'Pagination: max total hits'
    description: 'Upper cap on totalHits Meilisearch will report. Lowering this speeds up huge indexes at the cost of accurate deep-page counts. Default 1000.'
    type: int
    default: 1000

  meilisearch.defaults.faceting.maxValuesPerFacet:
    label: 'Faceting: max values per facet'
    description: 'How many distinct facet values are returned per attribute. Default 100. Raise for high-cardinality attributes like brand catalogues.'
    type: int
    default: 100

  meilisearch.defaults.faceting.sortFacetValuesBy:
    label: 'Faceting: default sort'
    description: 'Default value ordering across facets — "count" = by count descending (most common first), "alpha" = alphabetical ascending. Per-facet override via meilisearch.facets[*].sort in settings.yaml.'
    type: string
    default: 'count'

  meilisearch.defaults.searchCutoffMs:
    label: 'Search cutoff (ms)'
    description: 'Hard cap on query execution time. Meilisearch returns partial results once the cutoff hits. 0 = unlimited (engine default).'
    type: int
    default: 0

  # ---------------------------------------------------------------------
  # Frontend defaults.
  #
  # Consumed by SearchController + SearchService when a per-plugin TypoScript
  # override is absent. Changing these affects every site-level search box
  # that doesn't override them in plugin.tx_wsmeilisearch_search.settings.
  # ---------------------------------------------------------------------

  meilisearch.frontend.perPage:
    label: 'Default hits per page'
    description: 'Default page size when the plugin TypoScript does not set settings.perPage. Per-plugin TS still wins.'
    type: int
    default: 20

  meilisearch.frontend.highlightPreTag:
    label: 'Highlight: pre tag'
    description: 'HTML opening tag wrapped around matched substrings in snippets.'
    type: string
    default: '<mark>'

  meilisearch.frontend.highlightPostTag:
    label: 'Highlight: post tag'
    description: 'HTML closing tag wrapped around matched substrings in snippets.'
    type: string
    default: '</mark>'

  meilisearch.frontend.cropMarker:
    label: 'Snippet: crop marker'
    description: 'Marker inserted where snippet text is cut off (e.g. "…", "...").'
    type: string
    default: '…'

  meilisearch.frontend.cropLength:
    label: 'Snippet: crop length (words)'
    description: 'Words around the match in cropped snippets. Default 200 (matches the previous hardcoded value in SearchService).'
    type: int
    default: 200

  # ---------------------------------------------------------------------
  # Apply-settings command behaviour.
  # ---------------------------------------------------------------------

  meilisearch.sync.waitForTasks:
    label: 'Wait for Meilisearch tasks'
    description: 'When true, ws_meilisearch:apply-settings blocks until every Meilisearch task completes (recommended in CI / deploy hooks). Disable for fire-and-forget operation.'
    type: bool
    default: true

  # ---------------------------------------------------------------------
  # Editor-controlled relevance boost.
  #
  # Documents carry a `boost` float field that composites the per-type
  # multiplier (meilisearch.boosts.types.<type> in settings.yaml) with the
  # per-record TCA enum tx_wsmeilisearch_boost on pages / tx_news. The
  # boost is always written; it only influences ranking once an integrator
  # adds "boost:desc" to meilisearch.defaults.rankingRules (between
  # "attribute" and "sort" is the natural slot).
  # ---------------------------------------------------------------------

  meilisearch.boosts.recordOverrideEnabled:
    label: 'Honor per-record boost (TCA tx_wsmeilisearch_boost)'
    description: 'When true, indexers read the editor-set boost field on pages and news records and multiply it into the document boost. Disable to ignore the BE control and rely on per-type defaults only.'
    type: bool
    default: true